name: Publish to npm

on:
  push:
    branches:
      - main

# Prevent concurrent publish runs to avoid race conditions
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 ships npm 11.x, required for trusted publishing (OIDC).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Bump version
        id: version
        run: |
          git fetch --tags --prune
          # Get current version and calculate next version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEXT_VERSION=$(node -p "const v = require('./package.json').version.split('.'); v[2] = parseInt(v[2]) + 1; v.join('.')")
          NEXT_TAG="v${NEXT_VERSION}"
          
          echo "Current version: ${CURRENT_VERSION}"
          echo "Next version: ${NEXT_VERSION}"
          echo "Next tag: ${NEXT_TAG}"
          
          # Delete the next tag if it exists (both locally and remotely)
          if git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Tag ${NEXT_TAG} exists, deleting..."
            git tag -d "$NEXT_TAG" || true
            git push --delete origin "$NEXT_TAG" || true
            git fetch --tags --prune
          fi
          
          # Bump package.json/package-lock.json and commit, but do NOT tag yet.
          # The tag is created after the rebase below, so it cannot end up
          # pointing at a commit the rebase left outside main's history.
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git commit -am "chore: bump version to ${NEW_VERSION} [skip ci]"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
      
      # Publish BEFORE pushing the version commit and tag. The bump above is a
      # local commit only, so a rejected publish leaves main and the remote tags
      # untouched and the release can simply be retried. Pushing first is what
      # left v1.0.38 tagged on main but absent from the registry.
      #
      # Authenticates via the npm trusted publisher configured for
      # sebastianheide/pdf-ocr-ts + publish.yml, using the OIDC token granted
      # by `id-token: write` above. No NPM_TOKEN needed.
      - name: Publish to npm
        run: npm publish --provenance --access public
      
      - name: Push version commit and tag
        run: |
          git pull --rebase origin main
          # Tag only now, so it always points at the commit that actually
          # lands on main rather than at a pre-rebase copy of it. Annotated
          # (-a), because `git push --follow-tags` skips lightweight tags.
          git tag -a "v${{ steps.version.outputs.new_version }}" \
            -m "v${{ steps.version.outputs.new_version }}"
          git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Release v${{ steps.version.outputs.new_version }}
          body: |
            Automated release v${{ steps.version.outputs.new_version }}
          draft: false
          prerelease: false